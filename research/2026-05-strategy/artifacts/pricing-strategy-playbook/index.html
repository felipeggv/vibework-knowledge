/* =========================================================
   ARTIFACTS-PUBLISHER v2 — CSS BASE
   Maestro dark green + Fraunces serif H1 + Geist Mono H2 + JBMono body
   Hierarchy exported from typography-playground (2026-05-17)
   ========================================================= */
:root {
  /* Theme tokens (snapshot Maestro) */
    --bg-main: #0c0e0c;
  --bg-sidebar: #0f100f;
  --bg-activity: #141415;
  --border: #111311;
  --text-main: #f2f2c0;
  --text-dim: #cec8ba;
  --accent: #5b675b;
  --accent-dim: #262121;
  --accent-text: #ffffff;
  --success: #bed78e;
  --warning: #d0a795;
  --error: #ff5555;


  /* ---------- Typography (per-level tokens) ---------- */
  --h1-family: "Fraunces", Georgia, "Times New Roman", serif;
  --h1-size: 52px;
  --h1-weight: 600;
  --h1-lh: 1.05;
  --h1-tracking: -0.02em;

  --h2-family: "Geist Mono", ui-monospace, "JetBrains Mono", monospace;
  --h2-size: 26px;
  --h2-weight: 600;
  --h2-lh: 1.3;
  --h2-tracking: -0.005em;

  --h3-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --h3-size: 18px;
  --h3-weight: 500;
  --h3-lh: 1.4;

  --body-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --body-size: 16px;
  --body-weight: 400;
  --body-lh: 1.7;

  --ui-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ui-size: 11px;
  --ui-weight: 500;
  --ui-tracking: 0.1em;

  --code-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --code-size: 14px;
  --code-weight: 400;

  /* ---------- Backwards-compat aliases (legacy templates) ---------- */
  --font-sans: var(--body-family);
  --font-serif: var(--h1-family);
  --font-mono: var(--code-family);
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 26px;
  --text-3xl: 52px;

  /* ---------- Spacing scale (4px base) ---------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;

  /* ---------- Layout widths (expanded per user feedback) ---------- */
  --max-content: 920px;
  --max-wide: 1280px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: var(--body-family);
  font-size: var(--body-size);
  line-height: var(--body-lh);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* =========================================================
   APP HEADER (persistent — present on EVERY page of the wiki)
   ========================================================= */
.ap-app-header {
  border-bottom: 1px solid var(--border);
  background: var(--bg-sidebar);
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.ap-app-header-inner {
  max-width: var(--max-wide);
  margin: 0 auto;
  padding: var(--space-3) var(--space-5);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
}
.ap-wordmark {
  font-family: var(--ui-family);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--text-main);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
}
.ap-wordmark::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 1px;
}
.ap-wordmark .dim { color: var(--text-dim); font-weight: 400; margin-left: var(--space-2); }
.ap-app-nav {
  display: flex;
  gap: var(--space-4);
  align-items: center;
}
.ap-app-nav a {
  color: var(--text-dim);
  text-decoration: none;
  font-family: var(--ui-family);
  font-size: 13px;
  font-weight: 500;
  transition: color 0.15s;
}
.ap-app-nav a:hover, .ap-app-nav a.active { color: var(--text-main); }

/* =========================================================
   BREADCRUMB
   ========================================================= */
.ap-breadcrumb {
  max-width: var(--max-wide);
  margin: 0 auto;
  padding: var(--space-4) var(--space-5);
  font-family: var(--ui-family);
  font-size: var(--ui-size);
  font-weight: var(--ui-weight);
  letter-spacing: var(--ui-tracking);
  text-transform: uppercase;
  color: var(--text-dim);
}
.ap-breadcrumb a { color: var(--text-dim); text-decoration: none; }
.ap-breadcrumb a:hover { color: var(--text-main); }
.ap-breadcrumb .sep { color: var(--accent); margin: 0 var(--space-2); }
.ap-breadcrumb .current { color: var(--text-main); }

/* =========================================================
   PAGE LAYOUT — sidebar + main
   ========================================================= */
.ap-page {
  max-width: var(--max-wide);
  margin: 0 auto;
  padding: var(--space-5) var(--space-5) var(--space-9);
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: var(--space-7);
}
@media (max-width: 980px) {
  .ap-page { grid-template-columns: 1fr; gap: var(--space-5); }
  .ap-sidebar { order: 2; border-top: 1px solid var(--border); padding-top: var(--space-5); position: static; max-height: none; }
}

.ap-sidebar {
  position: sticky;
  top: 80px;
  align-self: start;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}
.ap-sidebar h4 {
  font-family: var(--ui-family);
  font-size: var(--ui-size);
  font-weight: 600;
  letter-spacing: var(--ui-tracking);
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 var(--space-3);
}
.ap-sidebar ul {
  list-style: none;
  padding: 0;
  margin: 0 0 var(--space-5);
}
.ap-sidebar li { margin-bottom: var(--space-2); }
.ap-sidebar a {
  color: var(--text-dim);
  text-decoration: none;
  font-family: var(--body-family);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  padding: var(--space-2) var(--space-3);
  display: block;
  border-radius: 4px;
  transition: all 0.15s;
}
.ap-sidebar a:hover { color: var(--text-main); background: var(--accent-dim); }
.ap-sidebar a.current {
  color: var(--accent);
  background: var(--accent-dim);
  font-weight: 600;
}

/* =========================================================
   ARTICLE (main content)
   ========================================================= */
.ap-article {
  max-width: var(--max-content);
}
.ap-article-header {
  margin-bottom: var(--space-7);
  padding-bottom: var(--space-5);
  border-bottom: 1px solid var(--border);
}
.ap-eyebrow {
  font-family: var(--ui-family);
  font-size: var(--ui-size);
  font-weight: 600;
  letter-spacing: var(--ui-tracking);
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 var(--space-3);
}
.ap-article h1 {
  font-family: var(--h1-family);
  font-weight: var(--h1-weight);
  font-size: var(--h1-size);
  line-height: var(--h1-lh);
  letter-spacing: var(--h1-tracking);
  color: var(--text-main);
  margin: 0 0 var(--space-3);
}
.ap-lead {
  font-family: var(--body-family);
  font-size: 18px;
  line-height: 1.6;
  color: var(--text-dim);
  margin: 0 0 var(--space-5);
  font-weight: 400;
}
.ap-meta-row {
  display: flex;
  gap: var(--space-4);
  flex-wrap: wrap;
  align-items: center;
  font-family: var(--ui-family);
  font-size: var(--ui-size);
  letter-spacing: var(--ui-tracking);
  text-transform: uppercase;
  color: var(--text-dim);
}
.ap-meta-row .tag {
  display: inline-block;
  padding: 3px 10px;
  background: var(--accent-dim);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: var(--ui-size);
  color: var(--text-dim);
  text-decoration: none;
  font-weight: 500;
  font-family: var(--ui-family);
  transition: all 0.15s;
}
.ap-meta-row .tag:hover { color: var(--text-main); border-color: var(--accent); }
.ap-meta-row .dot { color: var(--accent); }

/* Article body typography */
.ap-article h2 {
  font-family: var(--h2-family);
  font-weight: var(--h2-weight);
  font-size: var(--h2-size);
  line-height: var(--h2-lh);
  letter-spacing: var(--h2-tracking);
  color: var(--text-main);
  margin-top: var(--space-8);
  margin-bottom: var(--space-4);
}
.ap-article h3 {
  font-family: var(--h3-family);
  font-weight: var(--h3-weight);
  font-size: var(--h3-size);
  line-height: var(--h3-lh);
  color: var(--text-main);
  margin-top: var(--space-6);
  margin-bottom: var(--space-3);
}
.ap-article h4 {
  font-family: var(--h3-family);
  font-weight: 600;
  font-size: 16px;
  color: var(--text-main);
  margin-top: var(--space-5);
  margin-bottom: var(--space-3);
}
.ap-article p {
  font-family: var(--body-family);
  font-size: var(--body-size);
  font-weight: var(--body-weight);
  line-height: var(--body-lh);
  color: var(--text-main);
  margin: 0 0 var(--space-4);
}
.ap-article ul, .ap-article ol {
  font-family: var(--body-family);
  font-size: var(--body-size);
  line-height: var(--body-lh);
  color: var(--text-main);
  padding-left: var(--space-5);
  margin: 0 0 var(--space-4);
}
.ap-article li { margin-bottom: var(--space-2); }
.ap-article li::marker { color: var(--accent); }
.ap-article a {
  color: var(--success);
  text-decoration: underline;
  text-decoration-color: var(--accent);
  text-underline-offset: 3px;
  font-weight: 500;
}
.ap-article a:hover { color: var(--text-main); text-decoration-color: var(--success); }
.ap-article strong { color: var(--text-main); font-weight: 700; }
.ap-article em { font-style: italic; color: var(--text-dim); }

.ap-article code {
  font-family: var(--code-family);
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.9em;
  color: var(--text-main);
}
.ap-article pre {
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: var(--space-4) var(--space-5);
  overflow-x: auto;
  font-family: var(--code-family);
  font-size: var(--code-size);
  line-height: 1.6;
  margin: var(--space-4) 0;
}
.ap-article pre code {
  background: transparent;
  border: none;
  padding: 0;
  font-size: var(--code-size);
  color: var(--text-main);
}

.ap-article blockquote {
  margin: var(--space-5) 0;
  padding: var(--space-3) var(--space-5);
  border-left: 3px solid var(--accent);
  background: var(--bg-sidebar);
  border-radius: 0 4px 4px 0;
  color: var(--text-dim);
  font-family: var(--h1-family);
  font-style: italic;
  font-size: 20px;
  line-height: 1.5;
  font-weight: 500;
}

.ap-article table {
  width: 100%;
  border-collapse: collapse;
  margin: var(--space-5) 0;
  font-family: var(--body-family);
  font-size: 14px;
}
.ap-article th, .ap-article td {
  text-align: left;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border);
}
.ap-article th {
  font-family: var(--ui-family);
  color: var(--text-dim);
  font-weight: 600;
  font-size: var(--ui-size);
  letter-spacing: var(--ui-tracking);
  text-transform: uppercase;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--accent);
}
.ap-article tr:hover td { background: var(--accent-dim); }

.ap-article hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: var(--space-7) 0;
}

/* =========================================================
   FOOTER
   ========================================================= */
.ap-article-footer {
  margin-top: var(--space-8);
  padding-top: var(--space-5);
  border-top: 1px solid var(--border);
  font-family: var(--ui-family);
  font-size: var(--ui-size);
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.ap-article-footer .tags { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.ap-article-footer .meta {
  display: flex;
  gap: var(--space-4);
  align-items: center;
  letter-spacing: var(--ui-tracking);
  text-transform: uppercase;
}
.ap-article-footer .meta .accent { color: var(--accent); }

/* =========================================================
   GLOBAL SCROLLBAR
   ========================================================= */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-sidebar); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* =========================================================
   SELECTION
   ========================================================= */
::selection { background: var(--accent); color: var(--accent-text); }

</style>

</head>

  const SALT_B64 = "GZsA9QI0Ah//P+SDYI10Jw==";
  const IV_B64 = "ZcFL0s1CMo8osh37";
  const STORAGE_KEY = "ap-unlock-pricing-strategy-playbook";

  const gate = document.getElementById('ap-gate');
  const mount = document.getElementById('ap-content-mount');
  const form = document.getElementById('ap-gate-form');
  const input = document.getElementById('ap-gate-input');
  const err = document.getElementById('ap-gate-err');

  function b64(s) { const b = atob(s); const o = new Uint8Array(b.length); for (let i=0;i<b.length;i++) o[i] = b.charCodeAt(i); return o; }

  async function deriveKey(pwd, salt) {
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }

  async function tryUnlock(pwd) {
    try {
      const salt = b64(SALT_B64), iv = b64(IV_B64), cipher = b64(ENCRYPTED_PAYLOAD);
      const key = await deriveKey(pwd, salt);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      mount.innerHTML = new TextDecoder().decode(plain);
      mount.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) s.src = old.src; else s.textContent = old.textContent;
        old.replaceWith(s);
      });
      gate.style.display = 'none';
      mount.style.display = 'block';
      sessionStorage.setItem(STORAGE_KEY, pwd);
      return true;
    } catch (e) { return false; }
  }

  const saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) tryUnlock(saved).then(ok => { if (!ok) sessionStorage.removeItem(STORAGE_KEY); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const ok = await tryUnlock(input.value);
    if (!ok) { err.textContent = '✗ senha incorreta'; input.value = ''; input.focus(); }
  });
})();

  const mount = document.getElementById('ap-content-mount');
  if (mount) {
    mount.innerHTML = tpl.innerHTML;
    mount.style.display = 'none';
  } else {
    document.body.appendChild(tpl.content.cloneNode(true));
  }
})();
