<style>
/* =========================================================
   ARTIFACTS-PUBLISHER v2 — MAESTRO STYLE
   100% JetBrains Mono · UI compacta (14px base) · Obsidian sidebar
   ========================================================= */
:root {
  /* Theme tokens (snapshot Maestro) */
    --bg-main: #0c0e0c;
  --bg-sidebar: #0f100f;
  --bg-activity: #141415;
  --border: #111311;
  --text-main: #f2f2c0;
  --text-dim: #cec8ba;
  --accent: #5b675b;
  --accent-dim: #262121;
  --accent-text: #ffffff;
  --success: #bed78e;
  --warning: #d0a795;
  --error: #ff5555;


  /* ---------- Typography — ALL JetBrains Mono ---------- */
  --font: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Tamanhos compactos como Maestro */
  --t-base: 14px;     /* body */
  --t-sm:   13px;     /* meta, secondary */
  --t-xs:   12px;     /* micro labels */
  --t-2xs:  11px;     /* breadcrumb, pills */

  --t-h1:   24px;
  --t-h2:   18px;
  --t-h3:   16px;
  --t-h4:   14px;

  --lh-body: 1.7;
  --lh-tight: 1.4;
  --lh-heading: 1.3;

  /* ---------- Backwards-compat (templates antigos) ---------- */
  --font-sans: var(--font);
  --font-serif: var(--font);
  --font-mono: var(--font);
  --body-family: var(--font);
  --h1-family: var(--font);
  --h2-family: var(--font);
  --h3-family: var(--font);
  --ui-family: var(--font);
  --code-family: var(--font);
  --body-size: var(--t-base);
  --body-lh: var(--lh-body);
  --ui-size: var(--t-2xs);
  --ui-weight: 600;
  --ui-tracking: 0.08em;
  --code-size: var(--t-base);
  --text-xs: var(--t-2xs);
  --text-sm: var(--t-sm);
  --text-base: var(--t-base);
  --text-lg: var(--t-h3);
  --text-xl: var(--t-h2);
  --text-2xl: var(--t-h1);
  --text-3xl: var(--t-h1);

  /* ---------- Spacing scale (4px base) ---------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 28px;
  --space-7: 40px;
  --space-8: 56px;
  --space-9: 80px;

  /* ---------- Layout ---------- */
  --sidebar-w: 240px;
  --content-w: 880px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: var(--font);
  font-size: var(--t-base);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* =========================================================
   OBSIDIAN-STYLE LAYOUT
   Sidebar fixa à esquerda (full-height), main content à direita.
   ========================================================= */
.ap-app-header { display: none; }  /* removido: o wordmark vai pra dentro da sidebar */

.ap-app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}
@media (max-width: 880px) {
  .ap-app-shell { grid-template-columns: 1fr; }
  .ap-sidebar { position: static !important; height: auto !important; max-height: none !important; border-right: none !important; border-bottom: 1px solid var(--border); }
}

/* SIDEBAR — Obsidian style */
.ap-sidebar {
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: var(--space-4) 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.ap-sidebar .ap-brand {
  padding: 0 var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  text-decoration: none;
  color: var(--text-main);
  font-family: var(--font);
  font-size: var(--t-sm);
  font-weight: 600;
}
.ap-sidebar .ap-brand::before {
  content: "■";
  color: var(--accent);
  font-size: 10px;
}
.ap-sidebar .ap-brand .dim { color: var(--text-dim); font-weight: 400; margin-left: 4px; font-size: var(--t-xs); }

.ap-sidebar h4 {
  padding: 0 var(--space-4);
  font-size: var(--t-2xs);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: var(--space-3) 0 var(--space-2);
}
.ap-sidebar ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.ap-sidebar li { margin: 0; }
.ap-sidebar a {
  display: block;
  padding: 5px var(--space-4) 5px var(--space-5);
  color: var(--text-dim);
  text-decoration: none;
  font-family: var(--font);
  font-size: var(--t-sm);
  line-height: 1.4;
  border-left: 2px solid transparent;
  transition: all 0.12s;
}
.ap-sidebar a:hover { color: var(--text-main); background: var(--accent-dim); }
.ap-sidebar a.current {
  color: var(--accent);
  background: var(--accent-dim);
  border-left-color: var(--accent);
}

.ap-sidebar-spacer { flex: 1; }
.ap-sidebar .footnote {
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: var(--t-2xs);
  letter-spacing: 0.04em;
}

/* =========================================================
   MAIN — breadcrumb compacto + article
   ========================================================= */
.ap-main {
  padding: var(--space-5) var(--space-7) var(--space-9);
  max-width: var(--content-w);
}
@media (max-width: 880px) {
  .ap-main { padding: var(--space-5) var(--space-4) var(--space-7); }
}

.ap-breadcrumb {
  font-size: var(--t-2xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 var(--space-5);
  padding: 0;
  max-width: none;
}
.ap-breadcrumb a { color: var(--text-dim); text-decoration: none; }
.ap-breadcrumb a:hover { color: var(--text-main); }
.ap-breadcrumb .sep { color: var(--accent); margin: 0 8px; }
.ap-breadcrumb .current { color: var(--text-main); }

/* =========================================================
   ARTICLE
   ========================================================= */
.ap-article-header {
  margin-bottom: var(--space-6);
  padding-bottom: var(--space-4);
  border-bottom: 1px solid var(--border);
}
.ap-eyebrow {
  font-size: var(--t-2xs);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 var(--space-3);
}
.ap-article h1 {
  font-family: var(--font);
  font-weight: 600;
  font-size: var(--t-h1);
  line-height: var(--lh-heading);
  letter-spacing: 0;
  color: var(--text-main);
  margin: 0 0 var(--space-3);
}
.ap-lead {
  font-family: var(--font);
  font-size: var(--t-base);
  line-height: var(--lh-body);
  color: var(--text-dim);
  margin: 0 0 var(--space-4);
  font-weight: 400;
}
.ap-meta-row {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
  align-items: center;
  font-size: var(--t-2xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 600;
}
.ap-meta-row .tag {
  display: inline-block;
  padding: 2px 8px;
  background: var(--accent-dim);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: var(--t-2xs);
  color: var(--text-dim);
  text-decoration: none;
  font-weight: 600;
  font-family: var(--font);
  transition: all 0.15s;
}
.ap-meta-row .tag:hover { color: var(--text-main); border-color: var(--accent); }
.ap-meta-row .dot { color: var(--accent); }

/* Article body */
.ap-article h2 {
  font-family: var(--font);
  font-weight: 600;
  font-size: var(--t-h2);
  line-height: var(--lh-heading);
  color: var(--text-main);
  margin-top: var(--space-7);
  margin-bottom: var(--space-3);
}
.ap-article h3 {
  font-family: var(--font);
  font-weight: 600;
  font-size: var(--t-h3);
  line-height: var(--lh-heading);
  color: var(--text-main);
  margin-top: var(--space-5);
  margin-bottom: var(--space-2);
}
.ap-article h4 {
  font-family: var(--font);
  font-weight: 600;
  font-size: var(--t-h4);
  color: var(--text-dim);
  margin-top: var(--space-4);
  margin-bottom: var(--space-2);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ap-article p {
  font-family: var(--font);
  font-size: var(--t-base);
  font-weight: 400;
  line-height: var(--lh-body);
  color: var(--text-main);
  margin: 0 0 var(--space-3);
}
.ap-article ul, .ap-article ol {
  font-family: var(--font);
  font-size: var(--t-base);
  line-height: var(--lh-body);
  color: var(--text-main);
  padding-left: var(--space-5);
  margin: 0 0 var(--space-3);
}
.ap-article li { margin-bottom: 4px; }
.ap-article li::marker { color: var(--accent); }
.ap-article a {
  color: var(--success);
  text-decoration: underline;
  text-decoration-color: var(--accent);
  text-underline-offset: 3px;
}
.ap-article a:hover { color: var(--text-main); text-decoration-color: var(--success); }
.ap-article strong { color: var(--text-main); font-weight: 700; }
.ap-article em { font-style: italic; color: var(--text-dim); }

.ap-article code {
  font-family: var(--font);
  background: var(--bg-main);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.92em;
  color: var(--text-main);
}
.ap-article pre {
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: var(--space-3) var(--space-4);
  overflow-x: auto;
  font-family: var(--font);
  font-size: var(--t-sm);
  line-height: 1.55;
  margin: var(--space-3) 0;
}
.ap-article pre code {
  background: transparent;
  border: none;
  padding: 0;
  font-size: var(--t-sm);
  color: var(--text-main);
}

.ap-article blockquote {
  margin: var(--space-4) 0;
  padding: var(--space-2) var(--space-4);
  border-left: 3px solid var(--accent);
  background: var(--bg-sidebar);
  border-radius: 0 4px 4px 0;
  color: var(--text-dim);
  font-family: var(--font);
  font-style: italic;
  font-size: var(--t-base);
  line-height: var(--lh-body);
  font-weight: 400;
}

.ap-article table {
  width: 100%;
  border-collapse: collapse;
  margin: var(--space-4) 0;
  font-family: var(--font);
  font-size: var(--t-sm);
}
.ap-article th, .ap-article td {
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.ap-article th {
  color: var(--text-dim);
  font-weight: 600;
  font-size: var(--t-2xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--accent);
}
.ap-article tr:hover td { background: var(--accent-dim); }

.ap-article hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: var(--space-6) 0;
}

/* =========================================================
   FOOTER
   ========================================================= */
.ap-article-footer {
  margin-top: var(--space-7);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border);
  font-size: var(--t-2xs);
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.ap-article-footer .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.ap-article-footer .meta {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
}
.ap-article-footer .meta .accent { color: var(--accent); }

/* =========================================================
   SCROLLBAR + SELECTION
   ========================================================= */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-sidebar); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

::selection { background: var(--accent); color: var(--accent-text); }

/* =========================================================
   LEGACY classes still used by wiki-home / tema-home / gate
   (the .ap-page grid class still exists for tema-home alternative path)
   ========================================================= */
.ap-page {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--space-5);
  display: block;
}

</style>

  const IV_B64 = "ecZ9f1A2rGbxiN1+";
  const STORAGE_KEY = "ap-unlock-pricing-strategy-playbook";

  const gate = document.getElementById('ap-gate');
  const mount = document.getElementById('ap-content-mount');
  const form = document.getElementById('ap-gate-form');
  const input = document.getElementById('ap-gate-input');
  const err = document.getElementById('ap-gate-err');

  function b64(s) { const b = atob(s); const o = new Uint8Array(b.length); for (let i=0;i<b.length;i++) o[i] = b.charCodeAt(i); return o; }

  async function deriveKey(pwd, salt) {
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }

  async function tryUnlock(pwd) {
    try {
      const salt = b64(SALT_B64), iv = b64(IV_B64), cipher = b64(ENCRYPTED_PAYLOAD);
      const key = await deriveKey(pwd, salt);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      mount.innerHTML = new TextDecoder().decode(plain);
      mount.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) s.src = old.src; else s.textContent = old.textContent;
        old.replaceWith(s);
      });
      gate.style.display = 'none';
      mount.style.display = 'block';
      sessionStorage.setItem(STORAGE_KEY, pwd);
      return true;
    } catch (e) { return false; }
  }

  const saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) tryUnlock(saved).then(ok => { if (!ok) sessionStorage.removeItem(STORAGE_KEY); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const ok = await tryUnlock(input.value);
    if (!ok) { err.textContent = '✗ senha incorreta'; input.value = ''; input.focus(); }
  });
})();
