  const SALT_B64 = "6L5cgAZjnP+wVnIElQpdww==";
  const IV_B64 = "bHL3XgYKsKFeGZ4C";
  const STORAGE_KEY = "ap-unlock-duas-versoes-a-frente";

  const gate = document.getElementById('ap-gate');
  const mount = document.getElementById('ap-content-mount');
  const form = document.getElementById('ap-gate-form');
  const input = document.getElementById('ap-gate-input');
  const err = document.getElementById('ap-gate-err');

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function decryptPayload(password) {
    const salt = b64ToBytes(SALT_B64);
    const iv = b64ToBytes(IV_B64);
    const cipher = b64ToBytes(ENCRYPTED_PAYLOAD);
    const key = await deriveKey(password, salt);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipher);
    return new TextDecoder().decode(plainBuf);
  }

  async function tryUnlock(password) {
    try {
      const html = await decryptPayload(password);
      mount.innerHTML = html;
      // Re-executa scripts inline injetados via innerHTML (browsers não rodam automaticamente)
      mount.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) newScript.src = oldScript.src;
        else newScript.textContent = oldScript.textContent;
        oldScript.replaceWith(newScript);
      });
      gate.style.display = 'none';
      mount.style.display = 'block';
      sessionStorage.setItem(STORAGE_KEY, password);
      return true;
    } catch (e) {
      return false;
    }
  }

  // Auto-unlock se sessão já autenticou
  const saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) {
    tryUnlock(saved).then(ok => { if (!ok) sessionStorage.removeItem(STORAGE_KEY); });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const ok = await tryUnlock(input.value);
    if (!ok) {
      err.textContent = '✗ senha incorreta';
      input.value = '';
      input.focus();
    }
  });
